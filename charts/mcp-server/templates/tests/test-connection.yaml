apiVersion: v1
kind: Pod
metadata:
  name: {{ include "mcp-server.fullname" . }}-test-health
  labels:
    {{- include "mcp-server.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: health
      image: {{ .Values.test.image | quote }}
      command: ["curl", "-fsS", "--max-time", "5",
                "http://{{ include "mcp-server.fullname" . }}:{{ .Values.service.port }}{{ .Values.mcp.healthPath }}"]
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
