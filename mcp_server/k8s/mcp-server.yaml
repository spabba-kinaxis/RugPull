# Deploys the rugpull-detector MCP server.
# Apply with:  kubectl apply -f k8s/mcp-server.yaml
# Replace <registry> in the image and <client-namespace> in the NetworkPolicy.
apiVersion: v1
kind: Namespace
metadata:
  name: mcp-detector
---
# Approved baseline. Pipeline jobs replace this ConfigMap after a baseline PR merges
# (see design doc, step 9). It starts empty, so every server is "unapproved" until
# its first entry is merged.
apiVersion: v1
kind: ConfigMap
metadata:
  name: mcp-baseline
  namespace: mcp-detector
data:
  approved-tools.json: "{}"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rugpull-mcp
  namespace: mcp-detector
  labels:
    app: rugpull-mcp
spec:
  # Stateless HTTP, so more replicas are safe.
  replicas: 2
  selector:
    matchLabels:
      app: rugpull-mcp
  template:
    metadata:
      labels:
        app: rugpull-mcp
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rugpull-mcp
          image: <registry>/rugpull-mcp:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: MCP_TRANSPORT
              value: streamable-http
            - name: MCP_HOST
              value: 0.0.0.0
            - name: MCP_PORT
              value: "8000"
            - name: BASELINE_PATH
              value: /baseline/approved-tools.json
            - name: LOG_LEVEL
              value: INFO
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: baseline
              mountPath: /baseline
              readOnly: true
      volumes:
        - name: baseline
          configMap:
            name: mcp-baseline
---
apiVersion: v1
kind: Service
metadata:
  name: rugpull-mcp
  namespace: mcp-detector
  labels:
    app: rugpull-mcp
spec:
  type: ClusterIP
  selector:
    app: rugpull-mcp
  ports:
    - name: http
      port: 8000
      targetPort: http
---
# Only pods in the client namespace may reach the MCP server.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rugpull-mcp-ingress
  namespace: mcp-detector
spec:
  podSelector:
    matchLabels:
      app: rugpull-mcp
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: <client-namespace>
      ports:
        - port: 8000
